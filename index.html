<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iggy Research</title>
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <button data-cmd="library" data-i18n-title="tb.library" class="icon-btn"><svg class="tb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg></button>
        <span id="save-dot" class="new"></span>
        <span id="filename" data-i18n="file.untitled"></span>
        <button id="fav-star" class="icon-btn" data-i18n-title="tb.fav" hidden><svg class="tb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.25 4.1 1 5.8L12 16.9l-5.25 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg></button>
        <div class="spacer"></div>
        <button data-cmd="live" data-i18n-title="tb.live">Live</button>
        <button data-cmd="focus" data-i18n-title="tb.focus">Focus</button>
        <button data-cmd="typewriter" data-i18n-title="tb.typewriter">Typewriter</button>
        <button data-cmd="preview" data-i18n-title="tb.preview" data-i18n="tb.previewLabel"></button>
        <button data-cmd="ai" data-i18n-title="tb.ai">AI</button>
        <button data-cmd="reader" data-i18n-title="tb.reader" class="icon-btn"><svg class="tb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="1.6" fill="currentColor" stroke="none"/><path d="M5 11a8 8 0 0 1 8 8"/><path d="M5 4.5a14.5 14.5 0 0 1 14.5 14.5"/></svg></button>
        <button data-cmd="publish" data-i18n-title="tb.publish" class="icon-btn"><svg class="tb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
        <button data-cmd="history" data-i18n-title="tb.history" class="icon-btn"><svg class="tb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4v4.5H8"/><path d="M12 7.5V12l3 2"/></svg></button>
        <button data-cmd="sync" data-i18n-title="tb.sync" class="icon-btn"><svg class="tb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18.5h10.5a4 4 0 0 0 .6-7.96A6.2 6.2 0 0 0 6.2 9.6 4.5 4.5 0 0 0 7 18.5z"/></svg></button>
        <button data-cmd="theme" data-i18n-title="tb.theme" class="icon-btn"><svg class="tb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></svg></button>
        <button data-cmd="help" data-i18n-title="tb.help" class="icon-btn"><svg class="tb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1.1.9-1.1 1.6v.4"/><circle cx="12" cy="17" r=".9" fill="currentColor" stroke="none"/></svg></button>
        <button data-cmd="settings" data-i18n-title="tb.settings" class="icon-btn"><svg class="tb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </header>
      <main id="main">
        <aside id="library">
          <div class="lib-head">
            <strong id="lib-root" data-i18n-title="lib.root"></strong>
            <span>
              <button id="lib-new" data-i18n-title="lib.new" data-i18n-aria="lib.newNote"><svg class="icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
              <button id="lib-pick" data-i18n-title="lib.pick" data-i18n-aria="lib.pick"><svg class="icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5V18a1.5 1.5 0 0 0 1.5 1.5h15A1.5 1.5 0 0 0 21 18V9a1.5 1.5 0 0 0-1.5-1.5h-7.2L10.4 5H4.5A1.5 1.5 0 0 0 3 6.5z"/></svg></button>
            </span>
          </div>
          <input id="lib-filter" type="search" data-i18n-placeholder="lib.filter" />
          <ul id="lib-tree"></ul>
          <div id="lib-backlinks">
            <div class="lib-sub" data-i18n="lib.backlinks"></div>
            <ul id="backlinks"></ul>
          </div>
        </aside>
        <section id="editor"></section>
        <article id="preview" hidden></article>
        <aside id="ai-panel">
          <div class="ai-head">
            <strong id="ai-title" data-i18n="ai.title"></strong>
            <span id="ai-status"></span>
          </div>
          <div class="ai-actions">
            <button id="ai-summary" data-i18n-title="ai.summaryHint" data-i18n="ai.summary"></button>
            <button id="ai-links" data-i18n-title="ai.linksHint" data-i18n="ai.links"></button>
            <button id="ai-cliche" data-i18n-title="ai.clicheHint" data-i18n="ai.cliche"></button>
            <button id="ai-devil" data-i18n-title="ai.devilHint" data-i18n="ai.devil"></button>
            <button id="ai-past" data-i18n-title="ai.pastHint" data-i18n="ai.past"></button>
          </div>
          <div id="ai-current" class="ai-empty" data-i18n="ai.empty"></div>
          <details id="ai-history-wrap">
            <summary data-i18n="ai.history"></summary>
            <ol id="ai-history"></ol>
          </details>
        </aside>
      </main>
      <footer id="statusbar">
        <span id="wordmark">Iggy <em>Research</em></span>
        <div class="spacer"></div>
        <span id="sync-status"></span>
        <span id="stats"></span>
      </footer>
    </div>

    <dialog id="settings-dialog">
      <form method="dialog">
        <h2 data-i18n="set.title"></h2>
        <h3 data-i18n="set.language"></h3>
        <label><span data-i18n="set.uiLang"></span>
          <select name="uiLang"></select>
        </label>
        <label><span data-i18n="set.docLang"></span> <small id="doc-lang-detected" class="hint"></small>
          <select name="docLang"></select>
        </label>
        <h3 data-i18n="set.appearance"></h3>
        <div class="font-row">
          <label><span data-i18n="set.bodyFont"></span>
            <select name="bodyFont"></select>
          </label>
          <input type="text" name="bodyCustom" placeholder="np. Helvetica Neue" hidden />
        </div>
        <div class="font-row">
          <label><span data-i18n="set.headingFont"></span>
            <select name="headingFont"></select>
          </label>
          <input type="text" name="headingCustom" placeholder="np. Baskerville" hidden />
        </div>
        <label><span id="font-size-label"></span>
          <input type="range" name="fontSize" min="13" max="26" step="1" />
        </label>
        <div id="font-sample">
          <div class="sample-h" data-i18n="set.sampleH"></div>
          <p data-i18n-html="set.sampleP"></p>
        </div>

        <h3 data-i18n="set.files"></h3>
        <label class="row"><input type="checkbox" name="autosave" /> <span data-i18n="set.autosave"></span></label>

        <h3 data-i18n="set.ai"></h3>
        <label><span data-i18n="set.apiKey"></span>
          <input type="password" name="apiKey" placeholder="sk-or-..." autocomplete="off" />
        </label>
        <div class="field-label" data-i18n="set.taskModels"></div>
        <div id="task-models"></div>
        <div id="model-picker" hidden></div>
        <label><span data-i18n="set.debounce"></span>
          <input type="number" name="debounceMs" min="300" step="100" />
        </label>
        <label><span data-i18n="set.prompt"></span> <small class="hint" data-i18n="set.promptHint"></small>
          <textarea name="prompt" rows="8"></textarea>
        </label>
        <label class="row"><input type="checkbox" name="autoAnalyze" /> <span data-i18n="set.autoAnalyze"></span></label>

        <h3 data-i18n="set.local"></h3>
        <p class="hint" data-i18n="set.localHint"></p>
        <div class="local-row">
          <label class="row"><input type="checkbox" name="localOllama" /> Ollama</label>
          <input type="text" name="ollamaUrl" placeholder="http://localhost:11434" autocomplete="off" />
        </div>
        <div class="local-row">
          <label class="row"><input type="checkbox" name="localLmstudio" /> LM Studio</label>
          <input type="text" name="lmstudioUrl" placeholder="http://localhost:1234" autocomplete="off" />
        </div>
        <p class="hint" data-i18n="set.lmstudioHint"></p>
        <menu>
          <button value="cancel" data-i18n="set.cancel"></button>
          <button value="save" class="primary" data-i18n="set.save"></button>
        </menu>
      </form>
    </dialog>
    <dialog id="sync-dialog">
      <form method="dialog">
        <h2 data-i18n="sync.title"></h2>
        <div id="sync-out">
          <p class="hint" data-i18n="sync.intro"></p>
          <div id="sync-social" class="btn-row" hidden>
            <button type="button" id="sync-browser"></button>
          </div>
          <label><span data-i18n="sync.email"></span>
            <input type="email" name="email" autocomplete="email" />
          </label>
          <label id="sync-code-row" hidden><span data-i18n="sync.code"></span>
            <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" class="code-input" />
          </label>
          <details class="sync-advanced">
            <summary data-i18n="sync.customServer"></summary>
            <label><span data-i18n="sync.server"></span>
              <input type="text" name="server" placeholder="https://iggy-research.com" autocomplete="off" />
            </label>
            <p class="hint" data-i18n="sync.customServerHint"></p>
          </details>
          <div class="btn-row">
            <button type="button" id="sync-login" class="primary" data-i18n="sync.sendCode"></button>
            <button type="button" id="sync-resend" data-i18n="sync.resend" hidden></button>
          </div>
        </div>
        <div id="sync-in" hidden>
          <p id="sync-who"></p>
          <div class="btn-row">
            <button type="button" id="sync-now" class="primary" data-i18n="sync.now"></button>
            <button type="button" id="sync-logout" data-i18n="sync.logout"></button>
          </div>
          <h3 data-i18n="sync.e2e"></h3>
          <p class="hint" id="sync-e2e-state"></p>
          <div class="btn-row">
            <input type="password" name="passphrase" data-i18n-placeholder="sync.passphrase" autocomplete="off" />
            <button type="button" id="sync-unlock"></button>
            <button type="button" id="sync-e2e-off" data-i18n="sync.e2eOff"></button>
          </div>
        </div>
        <div id="sync-scope-wrap" hidden>
          <h3 data-i18n="sync.scope"></h3>
          <p class="hint" data-i18n="sync.scopeHint"></p>
          <div id="sync-scope"></div>
        </div>
        <p id="sync-msg" class="hint"></p>

        <h3 data-i18n="sync.git"></h3>
        <p class="hint" data-i18n="sync.gitHint"></p>
        <div class="btn-row">
          <input type="text" name="gitRemote" placeholder="git@github.com:ja/notatki.git" autocomplete="off" />
          <button type="button" id="git-sync" data-i18n="sync.gitNow"></button>
        </div>
        <p id="git-msg" class="hint"></p>
        <p class="hint" data-i18n="sync.cloudHint"></p>
        <menu><button value="close" data-i18n="common.close"></button></menu>
      </form>
    </dialog>

    <dialog id="history-dialog" class="wide">
      <form method="dialog">
        <h2><span data-i18n="hist.title"></span> <small id="hist-file" class="hint"></small></h2>
        <div class="hist-body">
          <ul id="hist-list"></ul>
          <div id="hist-preview" class="hint" data-i18n="hist.pick"></div>
        </div>
        <menu>
          <button type="button" id="hist-restore" class="primary" data-i18n="hist.restore" disabled></button>
          <button value="close" data-i18n="common.close"></button>
        </menu>
      </form>
    </dialog>
    <dialog id="publish-dialog">
      <form method="dialog">
        <h2><span data-i18n="pub.title"></span> <small id="pub-note" class="hint"></small></h2>
        <div class="mp-tabs pub-tabs">
          <button type="button" data-pub="iggy" data-i18n="pub.tabIggy"></button>
          <button type="button" data-pub="export" data-i18n="pub.tabExport"></button>
          <button type="button" data-pub="wp">WordPress</button>
          <button type="button" data-pub="ghost">Ghost</button>
          <button type="button" data-pub="substack">Substack</button>
        </div>
        <section data-pub-pane="iggy">
          <p class="hint" id="pub-iggy-login" data-i18n="pub.needLogin" hidden></p>
          <div id="pub-iggy-form">
            <label><span data-i18n="pub.blog"></span>
              <input type="text" name="pubBlog" list="pub-blogs" autocomplete="off" />
              <datalist id="pub-blogs"></datalist>
            </label>
            <p class="hint" id="pub-url"></p>
            <label><span data-i18n="pub.postTitle"></span><input type="text" name="pubTitle" /></label>
            <label><span data-i18n="pub.slug"></span><input type="text" name="pubSlug" /></label>
            <div class="local-row">
              <label><span data-i18n="pub.kind"></span>
                <select name="pubKind"><option value="post" data-i18n="pub.kindPost"></option><option value="garden" data-i18n="pub.kindGarden"></option></select>
              </label>
              <label><span data-i18n="pub.visibility"></span>
                <select name="pubVisibility">
                  <option value="public" data-i18n="pub.public"></option>
                  <option value="unlisted" data-i18n="pub.unlisted"></option>
                  <option value="private" data-i18n="pub.private"></option>
                </select>
              </label>
            </div>
            <p class="hint" id="pub-tags"></p>
            <label class="row" id="pub-newsletter-row"><input type="checkbox" name="pubNewsletter" /> <span data-i18n="pub.newsletter"></span></label>
            <div class="btn-row">
              <button type="button" id="pub-iggy" class="primary"></button>
              <button type="button" id="pub-iggy-off" data-i18n="pub.unpublish"></button>
            </div>
          </div>
        </section>
        <section data-pub-pane="export" hidden>
          <div class="btn-row">
            <button type="button" id="exp-md" data-i18n="pub.expMd"></button>
            <button type="button" id="exp-html" data-i18n="pub.expHtml"></button>
          </div>
          <h3 data-i18n="pub.expSite"></h3>
          <p class="hint" data-i18n="pub.expSiteHint"></p>
          <label><span data-i18n="pub.siteTitle"></span><input type="text" name="siteTitle" /></label>
          <label><span data-i18n="pub.siteUrl"></span><input type="text" name="siteUrl" placeholder="https://ja.github.io/notatki" /></label>
          <div class="btn-row"><button type="button" id="exp-site" data-i18n="pub.expSiteBtn"></button></div>
        </section>
        <section data-pub-pane="wp" hidden>
          <label><span data-i18n="pub.wpUrl"></span><input type="text" name="wpUrl" placeholder="https://moj-blog.pl" /></label>
          <label><span data-i18n="pub.wpUser"></span><input type="text" name="wpUser" /></label>
          <label><span data-i18n="pub.wpPass"></span><input type="password" name="wpPass" autocomplete="off" /></label>
          <div class="btn-row">
            <select name="wpStatus"><option value="draft" data-i18n="pub.draft"></option><option value="publish" data-i18n="pub.publishNow"></option></select>
            <button type="button" id="pub-wp" class="primary" data-i18n="pub.send"></button>
          </div>
        </section>
        <section data-pub-pane="ghost" hidden>
          <label><span data-i18n="pub.ghostUrl"></span><input type="text" name="ghostUrl" placeholder="https://moj-blog.ghost.io" /></label>
          <label><span data-i18n="pub.ghostKey"></span><input type="password" name="ghostKey" placeholder="id:secret" autocomplete="off" /></label>
          <div class="btn-row">
            <select name="ghostStatus"><option value="draft" data-i18n="pub.draft"></option><option value="published" data-i18n="pub.publishNow"></option></select>
            <button type="button" id="pub-ghost" class="primary" data-i18n="pub.send"></button>
          </div>
        </section>
        <section data-pub-pane="substack" hidden>
          <p class="hint" data-i18n="pub.substackHint"></p>
          <div class="btn-row"><button type="button" id="pub-copy" class="primary" data-i18n="pub.copyHtml"></button></div>
        </section>
        <p id="pub-msg" class="hint"></p>
        <menu><button value="close" data-i18n="common.close"></button></menu>
      </form>
    </dialog>
    <dialog id="reader-dialog" class="wide">
      <form method="dialog">
        <h2 data-i18n="rss.title"></h2>
        <div class="btn-row">
          <input type="text" name="feedUrl" data-i18n-placeholder="rss.addPh" autocomplete="off" />
          <button type="button" id="rss-add" data-i18n="rss.add"></button>
          <button type="button" id="rss-refresh" data-i18n="rss.refresh"></button>
        </div>
        <div class="rss-body">
          <ul id="rss-feeds"></ul>
          <ul id="rss-items"></ul>
          <article id="rss-article" class="hint" data-i18n="rss.pick"></article>
        </div>
        <p id="rss-msg" class="hint"></p>
        <menu>
          <button type="button" id="rss-open" data-i18n="rss.open" disabled></button>
          <button type="button" id="rss-note" class="primary" data-i18n="rss.toNote" disabled></button>
          <button value="close" data-i18n="common.close"></button>
        </menu>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
